[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vltconfig"
version = "1.0.1"
description = "Pydantic settings from HashiCorp Vault KV and JSON with caching and retry"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "hvac>=2.3.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "tenacity>=9.0.0",
]

[[project.authors]]
name = "tofuurem"
email = "rabbit_1399@icloud.com"

[project.urls]
Homepage = "https://github.com/tofuurem/vltconfig"
Repository = "https://github.com/tofuurem/vltconfig"
Issues = "https://github.com/tofuurem/vltconfig/issues"

[tool.setuptools]
packages = ["vltconfig"]

[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=4.6.0",
    "ruff>=0.9.4",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-env>=1.1.0",
    "pytest-mock>=3.12.0",
    "ty>=0.0.60",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["vltconfig", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=vltconfig",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
markers = [
    "unit: isolated unit tests",
    "integration: tests requiring disposable infrastructure",
    "slow: tests that are intentionally slower than the unit baseline",
]

[tool.coverage.run]
branch = true
source = ["vltconfig"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
