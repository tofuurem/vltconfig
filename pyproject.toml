[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vltconfig"
version = "2.0.0"
description = "Pydantic settings and schema-driven HashiCorp Vault KV v2 configuration"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "hvac>=2.4.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
]

[[project.authors]]
name = "tofuurem"
email = "rabbit_1399@icloud.com"

[project.urls]
Homepage = "https://github.com/tofuurem/vltconfig"
Repository = "https://github.com/tofuurem/vltconfig"
Issues = "https://github.com/tofuurem/vltconfig/issues"

[project.scripts]
vltconfig = "vltconfig.cli:main"

[project.optional-dependencies]
yaml = ["ruamel.yaml>=0.19.1"]

[tool.setuptools.packages.find]
include = ["vltconfig*"]

[tool.setuptools.package-data]
vltconfig = ["py.typed"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "ruamel.yaml>=0.19.1",
    "twine>=6.2.0",
    "ty>=0.0.60",
    "zizmor>=1.27.0",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["vltconfig", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "C90", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=vltconfig",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
markers = [
    "unit: isolated unit tests",
    "integration: tests requiring disposable infrastructure",
    "slow: tests that are intentionally slower than the unit baseline",
]

[tool.coverage.run]
branch = true
source = ["vltconfig"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
